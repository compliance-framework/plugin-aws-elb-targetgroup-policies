name: Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.6.0
      - run: opa fmt --list --fail policies
      - run: opa check --strict policies
      - run: opa test policies
